name: Build Fluid Connector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'connector/**'
      - '.github/workflows/build-connector.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - name: Install dependencies
        working-directory: connector
        run: npm ci
      - name: Build connector executable
        working-directory: connector
        run: npm run package
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        working-directory: connector
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Publish latest connector installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view connector-latest 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create connector-latest --title "Fluid Connector (latest POC)" --notes "Latest unsigned Windows POC connector build." }
          gh release upload connector-latest connector/dist/FluidConnectorSetup.exe --clobber
